name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: r-devops-magistracy-project-2sem-1407472818
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  DOCKERHUB_USER: naraka24e1

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ env.DOCKERHUB_USER }}/sausage-backend:latest
            build-args: |
              VERSION=${{ github.sha }}
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ env.DOCKERHUB_USER }}/sausage-frontend:latest
        - name: Push Backend-report to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend-report/
            push: true
            tags: ${{ env.DOCKERHUB_USER }}/sausage-backend-report:latest

  add_helm_chart_to_nexus:
      name: Add Helm Chart To Nexus
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Install Helm
          uses: azure/setup-helm@v3
          with:
            version: v3.12.3
        - name: Package and upload Helm chart to Nexus
          run: |
            helm lint ./sausage-store-chart
            helm package ./sausage-store-chart
            CHART_FILE=$(ls sausage-store-*.tgz | head -n 1)
            curl -f -u "${NEXUS_HELM_REPO_USER}:${NEXUS_HELM_REPO_PASSWORD}" \
              "${NEXUS_HELM_REPO}/" \
              --upload-file "${CHART_FILE}"

  deploy_helm_chart_to_kubernetes:
      name: Deploy Helm Chart To Kubernetes
      runs-on: ubuntu-latest
      needs: add_helm_chart_to_nexus
      steps:
        - name: Install Helm
          uses: azure/setup-helm@v3
          with:
            version: v3.12.3
        - name: Setup kubeconfig
          run: |
            mkdir -p "$HOME/.kube"
            echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config" 2>/dev/null \
              || echo "$KUBE_CONFIG" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
        - name: Add Nexus Helm repository
          run: |
            helm repo add nexus "$NEXUS_HELM_REPO" --username "$NEXUS_HELM_REPO_USER" --password "$NEXUS_HELM_REPO_PASSWORD"
            helm repo update
        - name: Deploy Helm chart to Kubernetes
          run: |
            helm upgrade --install sausage-store nexus/sausage-store \
              --namespace "$SAUSAGE_STORE_NAMESPACE" \
              --version 0.1.0 \
              --atomic \
              --wait \
              --timeout 15m
