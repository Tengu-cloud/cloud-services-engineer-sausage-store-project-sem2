apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sausage-store
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        envFrom:
          - configMapRef:
              name: mongodb-conf
        ports:
        - containerPort: {{ .Values.mongodb.containerPort }}
        resources:
{{ toYaml .Values.mongodb.resources | indent 10 }}
        readinessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - db.adminCommand('ping')
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sausage-store
spec:
  ports:
  - port: {{ .Values.mongodb.containerPort }}
    targetPort: {{ .Values.mongodb.containerPort }}
  selector:
    app: mongodb
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-conf
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}
{{- if .Values.mongodb.init.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb-init
    app.kubernetes.io/name: mongodb-init
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    app.kubernetes.io/part-of: sausage-store
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: mongodb-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongodb-init
        image: mongo:7.0
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            echo "Waiting for MongoDB..."
            i=0
            until mongosh --host mongodb-0.mongodb --username "{{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}" --password "{{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}" --authenticationDatabase admin --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
              i=$((i+1))
              if [ "$i" -gt 60 ]; then
                echo "MongoDB is not ready after 5 minutes"
                exit 1
              fi
              echo "MongoDB is not ready yet ($i)..."
              sleep 5
            done
            echo "MongoDB is up, creating reports user..."
            mongosh --host mongodb-0.mongodb --username "{{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}" --password "{{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}" --authenticationDatabase admin --quiet --eval '
              const dbName = "{{ .Values.mongodb.init.reportsDb }}";
              const user = "{{ .Values.mongodb.init.reportsUser }}";
              const pwd = "{{ .Values.mongodb.init.reportsPassword }}";
              const target = db.getSiblingDB(dbName);
              try {
                target.createUser({
                  user: user,
                  pwd: pwd,
                  roles: [{ role: "readWrite", db: dbName }]
                });
                print("User created");
              } catch (e) {
                const msg = String(e);
                if (msg.indexOf("already exists") !== -1 || msg.indexOf("duplicate") !== -1 || e.code === 51003) {
                  print("User already exists");
                } else {
                  throw e;
                }
              }
            '
            echo "MongoDB init completed"
{{- end }}
